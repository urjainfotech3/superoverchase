<div class="card"><h1>🏏 Super Over Chase</h1>
<p id="msg">તમને ચેલેન્જ મળી છે! ગેમ ખોલો અથવા ઇન્સ્ટોલ કરો.</p>
<a id="open" class="p" href="#">ગેમ ખોલો</a>
<a id="install" class="s" href="#">Play Store પરથી ઇન્સ્ટોલ કરો</a></div>
<script>
var PKG="com.superoverchase.game";
var code=(new URLSearchParams(location.search).get("code")||"").trim();
var ok=/^[A-Za-z0-9]{4,32}$/.test(code);
var store="https://play.google.com/store/apps/details?id="+PKG;
if(ok)store+="&referrer="+encodeURIComponent("challenge="+code);
document.getElementById("install").href=store;
if(!ok){document.getElementById("msg").textContent="આ ચેલેન્જ લિંક માન્ય નથી.";document.getElementById("open").style.display="none";}
else{
document.getElementById("open").href="intent://"+location.host+location.pathname+"?code="+code+"#Intent;scheme=https;package="+PKG+";end";
setTimeout(function(){location.href=store;},2500);
}
</script><!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "a43e99d96c0543bb9a76567e6b6e359e"}'></script><!-- End Cloudflare Web Analytics -->
